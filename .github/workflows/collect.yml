name: Collect projections

on:
  schedule:
    # Times are UTC. Every 4 hours, plus extra runs before the Thursday, Sunday and Monday games.
    - cron: "17 */4 * * *"
    - cron: "40 21 * * 4"   # Thu ~5:40pm ET
    - cron: "40 15 * * 0"   # Sun ~11:40am ET (after inactives are close)
    - cron: "40 22 * * 1"   # Mon ~6:40pm ET
  workflow_dispatch:
    inputs:
      week:
        description: "Week to collect (blank = current week)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GD_WEEK: ${{ github.event.inputs.week }}
        run: python collector/collect.py
      - name: Commit data
        run: |
          git config user.name "gameday-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update projections $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --quiet origin main
          git push
